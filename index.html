<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radial Symmetry</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --accent: #00d4ff;
            --text: #e0e0e0;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
        }
        #toolbar {
            width: 260px;
            background: var(--panel);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* Checkerboard pattern to show transparency capability */
            background-image: linear-gradient(45deg, #1a1a1a 25%, transparent 25%), linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1a1a1a 75%), linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        canvas {
            background: #ffffff;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            cursor: crosshair;
            touch-action: none;
            max-width: 95%;
            max-height: 95%;
        }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #888; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 6px; cursor: pointer; background: none; }
        button {
            background: var(--accent); color: #000; border: none; padding: 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        button.secondary { background: #333; color: var(--text); }
        .checkbox-group { flex-direction: row; align-items: center; gap: 10px; }
        .checkbox-group input { width: auto; accent-color: var(--accent); transform: scale(1.2); }
        h1 { font-size: 20px; margin: 0 0 10px 0; color: var(--accent); font-weight: 800; letter-spacing: -0.5px; }
        
        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            #toolbar { width: 100%; height: auto; padding: 15px; box-sizing: border-box; flex-direction: row; flex-wrap: wrap; align-items: center; }
            .control-group { flex: 1; min-width: 120px; }
            h1 { width: 100%; margin-bottom: 5px; }
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <h1>Radial Studio</h1>
        
        <div class="control-group">
            <label>Brush Color</label>
            <input type="color" id="colorPicker" value="#00d4ff">
        </div>

        <div class="control-group">
            <label>Size: <span id="sizeValue">5</span>px</label>
            <input type="range" id="brushSize" min="1" max="50" value="5">
        </div>

        <div class="control-group">
            <label>Segments: <span id="segmentValue">8</span></label>
            <input type="range" id="segments" min="2" max="36" value="8">
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="mirrorMode">
            <label for="mirrorMode" style="text-transform: none; color: var(--text); cursor: pointer;">Kaleidoscope (Mirror)</label>
        </div>

        <div class="control-group" style="margin-top: auto; gap: 10px; flex-direction: row;">
            <button id="undoBtn" class="secondary" style="flex:1">Undo</button>
            <button id="clearBtn" class="secondary" style="flex:1">Clear</button>
        </div>
        <button id="exportBtn">Export PNG</button>
    </div>

    <div id="canvas-container">
        <canvas id="canvas" width="800" height="800"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let history = [];
        let historyStep = -1;

        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const segmentsInput = document.getElementById('segments');
        const mirrorMode = document.getElementById('mirrorMode');

        function initCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState();
        }

        function saveState() {
            historyStep++;
            if (historyStep < history.length) history.length = historyStep;
            history.push(canvas.toDataURL());
            if (history.length > 30) { history.shift(); historyStep--; }
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                const img = new Image();
                img.src = history[historyStep];
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x; lastY = pos.y;
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const segments = parseInt(segmentsInput.value);
            const angleStep = (Math.PI * 2) / segments;

            ctx.strokeStyle = colorPicker.value;
            ctx.lineWidth = brushSize.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let i = 0; i < segments; i++) {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(i * angleStep);
                
                ctx.beginPath();
                ctx.moveTo(lastX - centerX, lastY - centerY);
                ctx.lineTo(pos.x - centerX, pos.y - centerY);
                ctx.stroke();

                if (mirrorMode.checked) {
                    ctx.scale(1, -1);
                    ctx.beginPath();
                    ctx.moveTo(lastX - centerX, lastY - centerY);
                    ctx.lineTo(pos.x - centerX, pos.y - centerY);
                    ctx.stroke();
                }
                ctx.restore();
            }
            lastX = pos.x; lastY = pos.y;
            e.preventDefault();
        }

        function stopDrawing() {
            if (isDrawing) { isDrawing = false; saveState(); }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        brushSize.addEventListener('input', (e) => document.getElementById('sizeValue').textContent = e.target.value);
        segmentsInput.addEventListener('input', (e) => document.getElementById('segmentValue').textContent = e.target.value);

        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState();
        });
        document.getElementById('exportBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `radial-art-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });

        initCanvas();
    </script>
</body>
</html>
