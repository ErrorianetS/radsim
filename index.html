<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radial Art</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #161616;
            --panel-border: #2a2a2a;
            --accent: #00d4ff;
            --accent-hover: #33e0ff;
            --text: #ffffff;
            --text-muted: #a0a0a0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
        }
        #toolbar {
            width: 300px;
            background: var(--panel);
            border-right: 1px solid var(--panel-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            overflow-y: auto;
        }
        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #0a0a0a;
            background-image: 
                linear-gradient(45deg, #111 25%, transparent 25%), 
                linear-gradient(-45deg, #111 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #111 75%), 
                linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        #canvas-wrapper {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            max-width: 1200px;
            max-height: 1200px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            background: #ffffff; /* Default solid white */
        }
        #mainCanvas, #overlayCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        #mainCanvas {
            touch-action: none;
            cursor: crosshair;
            z-index: 2;
        }
        #overlayCanvas {
            pointer-events: none;
            z-index: 3;
        }
        .group { border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 5px; }
        .group:last-child { border-bottom: none; }
        h3 { margin: 0 0 12px 0; font-size: 12px; text-transform: uppercase; color: var(--accent); letter-spacing: 1.5px; font-weight: 700; }
        .control-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        input[type="color"] { width: 100%; height: 36px; border: 1px solid var(--panel-border); border-radius: 6px; cursor: pointer; background: var(--bg); padding: 2px; }
        select { width: 100%; padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--panel-border); border-radius: 6px; font-size: 13px; cursor: pointer; }
        select:focus { outline: 1px solid var(--accent); }
        
        button {
            background: var(--accent); color: #000; border: none; padding: 10px;
            border-radius: 6px; font-weight: 700; cursor: pointer; transition: all 0.2s;
            width: 100%; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: #2a2a2a; color: var(--text); border: 1px solid var(--panel-border); }
        button.secondary:hover { background: #333; }
        button.active { background: var(--accent); color: #000; }
        
        .checkbox-group { flex-direction: row; align-items: center; gap: 10px; margin-top: 8px; }
        .checkbox-group input { width: auto; accent-color: var(--accent); transform: scale(1.2); cursor: pointer; }
        .checkbox-group label { text-transform: none; color: var(--text); cursor: pointer; font-size: 13px; letter-spacing: 0; margin: 0; }
        
        h1 { font-size: 20px; margin: 0 0 15px 0; color: var(--text); font-weight: 800; letter-spacing: -0.5px; text-align: center; border-bottom: 1px solid var(--panel-border); padding-bottom: 15px; }
        h1 span { color: var(--accent); }

        /* Tips Section */
        .tips-box {
            background: #1a1a1a;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 12px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .tips-box strong { color: var(--text); }
        .key { display: inline-block; background: #333; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 11px; color: var(--accent); border: 1px solid #444; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #toolbar { width: 100%; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--panel-border); }
            #canvas-container { flex: 1; min-height: 0; }
            #canvas-wrapper { width: 95vmin; height: 95vmin; }
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <h1>Radial <span>Art</span></h1>
        
        <div class="group">
            <h3>Brush</h3>
            <div class="control-group">
                <label>Shape</label>
                <select id="brushShape">
                    <option value="round">Round</option>
                    <option value="square">Square</option>
                    <option value="triangle">Triangle</option>
                    <option value="star">Star</option>
                </select>
            </div>
            <div class="control-group">
                <label>Color</label>
                <input type="color" id="colorPicker" value="#00d4ff">
            </div>
            <div class="control-group">
                <label>Size: <span id="sizeValue">8</span>px</label>
                <input type="range" id="brushSize" min="1" max="100" value="8">
            </div>
            <div class="control-group">
                <label>Opacity: <span id="opacityValue">100</span>%</label>
                <input type="range" id="brushOpacity" min="1" max="100" value="100">
            </div>
            <div class="control-group checkbox-group">
                <input type="checkbox" id="rainbowMode">
                <label for="rainbowMode">Rainbow Gradient</label>
            </div>
            <div class="control-group">
                <label>Blend Mode</label>
                <select id="blendMode">
                    <option value="source-over">Normal</option>
                    <option value="lighter">Additive (Glow)</option>
                    <option value="multiply">Multiply (Darken)</option>
                </select>
            </div>
        </div>

        <div class="group">
            <h3>Symmetry</h3>
            <div class="control-group">
                <label>Segments: <span id="segmentValue">8</span></label>
                <input type="range" id="segments" min="1" max="36" value="8">
            </div>
            <div class="control-group">
                <label>Rotation: <span id="rotValue">0</span>°</label>
                <input type="range" id="symRotation" min="0" max="360" value="0">
            </div>
            <div class="control-group checkbox-group">
                <input type="checkbox" id="mirrorMode">
                <label for="mirrorMode">Kaleidoscope (Mirror)</label>
            </div>
        </div>

        <div class="group">
            <h3>Canvas</h3>
            <div class="control-group">
                <label>Background Color</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
            <div class="control-group checkbox-group">
                <input type="checkbox" id="transparentBg">
                <label for="transparentBg">Transparent Background</label>
            </div>
            <div class="control-group checkbox-group">
                <input type="checkbox" id="showGuides" checked>
                <label for="showGuides">Show Symmetry Guides</label>
            </div>
        </div>

        <div class="group">
            <div style="display:flex; gap:8px; margin-bottom:8px;">
                <button id="undoBtn" class="secondary" style="flex:1">Undo</button>
                <button id="redoBtn" class="secondary" style="flex:1">Redo</button>
            </div>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
                <button id="eraserBtn" class="secondary" style="flex:1">Eraser: OFF</button>
                <button id="lockBtn" class="secondary" style="flex:1">Lock Mouse: OFF</button>
            </div>
            <button id="clearBtn" class="secondary">Clear Canvas</button>
            <button id="exportBtn" style="margin-top: 8px;">Export PNG</button>
        </div>

        <div class="tips-box">
            <strong>💡 Tips & Keybinds</strong><br>
            • Click canvas to <strong>Lock Mouse</strong> (infinite drawing)<br>
            • <span class="key">Esc</span> to unlock mouse<br>
            • <span class="key">Ctrl</span>+<span class="key">Z</span> Undo &nbsp;|&nbsp; <span class="key">Ctrl</span>+<span class="key">Y</span> Redo<br>
            • <span class="key">G</span> Toggle Guides &nbsp;|&nbsp; <span class="key">E</span> Toggle Eraser<br>
            • <span class="key">L</span> Toggle Mouse Lock
        </div>
    </div>

    <div id="canvas-container">
        <div id="canvas-wrapper">
            <canvas id="mainCanvas" width="1200" height="1200"></canvas>
            <canvas id="overlayCanvas" width="1200" height="1200"></canvas>
        </div>
    </div>

    <script>
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d', { willReadFrequently: true });
        const overlay = document.getElementById('overlayCanvas');
        const overlayCtx = overlay.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');

        // Offscreen background canvas
        const bgCanvas = document.createElement('canvas');
        bgCanvas.width = 1200; bgCanvas.height = 1200;
        const bgCtx = bgCanvas.getContext('2d');

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let history = [];
        let historyStep = -1;
        let isEraser = false;
        let hue = 0;

        // Pointer Lock State
        let isPointerLocked = false;
        let virtualX = 600, virtualY = 600;

        // UI Elements
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const brushOpacity = document.getElementById('brushOpacity');
        const brushShape = document.getElementById('brushShape');
        const rainbowMode = document.getElementById('rainbowMode');
        const blendMode = document.getElementById('blendMode');
        const segmentsInput = document.getElementById('segments');
        const symRotation = document.getElementById('symRotation');
        const mirrorMode = document.getElementById('mirrorMode');
        const bgColor = document.getElementById('bgColor');
        const transparentBg = document.getElementById('transparentBg');
        const showGuides = document.getElementById('showGuides');
        const eraserBtn = document.getElementById('eraserBtn');
        const lockBtn = document.getElementById('lockBtn');

        function init() {
            updateBackground();
            clearCanvas(false);
            drawGuides();
            saveState();
        }

        function saveState() {
            historyStep++;
            if (historyStep < history.length) history.length = historyStep;
            history.push(mainCanvas.toDataURL());
            if (history.length > 40) { history.shift(); historyStep--; }
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                restoreState();
            }
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                restoreState();
            }
        }

        function restoreState() {
            const img = new Image();
            img.src = history[historyStep];
            img.onload = () => {
                ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
                ctx.drawImage(img, 0, 0);
            };
        }

        function clearCanvas(pushHistory = true) {
