<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Radial Art — Kaleidoscope Drawing</title>
<style>
    :root {
        --bg: #0d0d0d;
        --panel: #161616;
        --panel-border: #2a2a2a;
        --text: #ffffff;
        --text-muted: #9a9a9a;
        --btn-bg: #2a2a2a;
        --btn-hover: #3a3a3a;
        --track: #333;
        --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0; overflow: hidden;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex; height: 100vh; height: 100dvh;
        -webkit-tap-highlight-color: transparent;
    }
    body.hide-ui #toolbar { display: none; }

    #toolbar {
        flex: 0 0 310px; background: var(--panel);
        border-right: 1px solid var(--panel-border);
        padding: 16px; display: flex; flex-direction: column; gap: 12px;
        overflow-y: auto; overscroll-behavior: contain; z-index: 10;
    }
    #toolbar::-webkit-scrollbar { width: 8px; }
    #toolbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .header {
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; gap: 8px;
    }
    h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: -0.3px; }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
        width: 32px; height: 32px; padding: 0; font-size: 14px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 6px; text-transform: none;
    }

    .group { border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; }
    .group:last-child { border-bottom: none; padding-bottom: 0; }

    h3 {
        margin: 0 0 8px 0; font-size: 10px; text-transform: uppercase;
        color: var(--text-muted); letter-spacing: 1.5px; font-weight: 700;
    }

    .control-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .control-group:last-child { margin-bottom: 0; }

    label {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
        color: var(--text-muted); display: flex; justify-content: space-between;
        align-items: baseline; gap: 8px;
    }
    label .val { color: var(--text); font-variant-numeric: tabular-nums; }
    kbd {
        font-family: inherit; font-size: 9px; color: #777;
        border: 1px solid #333; border-radius: 3px; padding: 0 3px;
    }

    input[type="range"] {
        -webkit-appearance: none; appearance: none; width: 100%;
        height: 18px; background: transparent; cursor: pointer; margin: 0;
    }
    input[type="range"]::-webkit-slider-runnable-track {
        height: 4px; border-radius: 2px; background: var(--track);
    }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5.5px;
        border-radius: 50%; background: #fff; border: none;
        transition: transform .12s ease;
    }
    input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.2); }
    input[type="range"]::-moz-range-track {
        height: 4px; border-radius: 2px; background: var(--track);
    }
    input[type="range"]::-moz-range-thumb {
        width: 15px; height: 15px; border: none; border-radius: 50%; background: #fff;
    }

    input[type="color"] {
        -webkit-appearance: none; appearance: none; width: 100%; height: 36px;
        padding: 0; border: 1px solid var(--panel-border); border-radius: 8px;
        background: var(--bg); cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 4px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }
    input[type="color"]::-moz-color-swatch { border: none; border-radius: 5px; }

    select {
        width: 100%; padding: 8px; background: var(--bg); color: var(--text);
        border: 1px solid var(--panel-border); border-radius: 6px;
        font-size: 13px; cursor: pointer;
    }
    select:focus-visible, input:focus-visible, button:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px;
    }

    button {
        background: var(--btn-bg); color: var(--text);
        border: 1px solid var(--panel-border);
        padding: 9px; border-radius: 6px; font-weight: 700; cursor: pointer;
        transition: background .15s, color .15s, border-color .15s, opacity .15s;
        width: 100%; font-size: 12px; text-transform: uppercase;
        letter-spacing: 0.5px; font-family: inherit;
    }
    button:hover:not(:disabled) { background: var(--btn-hover); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    .checkbox-group { flex-direction: row; align-items: center; gap: 10px; margin-bottom: 8px; }
    .checkbox-group input[type="checkbox"] {
        width: 16px; height: 16px; accent-color: #fff; cursor: pointer; margin: 0; flex: none;
    }
    .checkbox-group label {
        text-transform: none; color: var(--text); cursor: pointer;
        font-size: 13px; letter-spacing: 0; margin: 0; justify-content: flex-start;
    }

    .btn-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .btn-row:last-child { margin-bottom: 0; }

    .preset-row {
        display: grid; grid-template-columns: repeat(4, 1fr);
        gap: 5px; margin-top: 6px;
    }
    .preset-btn { padding: 6px 0; font-size: 11px; letter-spacing: 0; text-transform: none; }

    .swatch-row {
        display: grid; grid-template-columns: repeat(9, 1fr);
        gap: 4px; margin-top: 6px;
    }
    .swatch {
        aspect-ratio: 1; border-radius: 4px; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.1);
        transition: transform .1s; padding: 0; position: relative;
    }
    .swatch::after {
        content: attr(data-key); position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 9px; font-weight: 700; color: rgba(0,0,0,0.55);
        text-shadow: 0 0 2px rgba(255,255,255,0.7);
        pointer-events: none;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active { outline: 2px solid #fff; outline-offset: 1px; }

    .color-row { display: flex; gap: 6px; align-items: stretch; }
    .color-row input[type="color"] { flex: 1; }
    .dice-btn {
        width: 44px; flex: none; padding: 0; font-size: 18px;
        text-transform: none; letter-spacing: 0;
    }

    #canvas-container {
        flex: 1 1 auto; min-width: 0; min-height: 0;
        display: flex; justify-content: center; align-items: center;
        position: relative; overflow: hidden; padding: 14px;
        background-color: #0a0a0a;
        background-image:
            linear-gradient(45deg, #131313 25%, transparent 25%),
            linear-gradient(-45deg, #131313 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #131313 75%),
            linear-gradient(-45deg, transparent 75%, #131313 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        touch-action: none;
    }
    #canvas-container.pan-ready { cursor: grab; }
    #canvas-container.panning { cursor: grabbing; }

    #canvas-wrapper {
        position: relative;
        width: 600px; height: 600px;
        max-width: 100%; max-height: 100%;
        background-color: #fff;
        box-shadow: 0 0 40px rgba(0,0,0,.85);
        will-change: transform;
        transform-origin: center center;
    }
    #canvas-wrapper.transparent-bg {
        background-image:
            linear-gradient(45deg, #eaeaea 25%, transparent 25%),
            linear-gradient(-45deg, #eaeaea 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #eaeaea 75%),
            linear-gradient(-45deg, transparent 75%, #eaeaea 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    #mainCanvas, #overlayCanvas {
        position: absolute; inset: 0;
        width: 100%; height: 100%; display: block; background: transparent;
    }
    #mainCanvas { z-index: 2; cursor: crosshair; touch-action: none; }
    #overlayCanvas { z-index: 3; pointer-events: none; }

    #zoom-controls {
        position: absolute; bottom: 20px; right: 20px;
        display: flex; flex-direction: column; align-items: center;
        gap: 6px; z-index: 20; user-select: none;
    }
    #zoom-controls button {
        width: 36px; height: 36px; padding: 0; border-radius: 8px;
        font-size: 15px; text-transform: none; letter-spacing: 0; line-height: 1;
        background: rgba(30,30,30,0.9);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #zoomLabel {
        font-size: 10px; color: #888;
        background: rgba(20,20,20,0.9);
        padding: 3px 8px; border-radius: 4px;
        font-variant-numeric: tabular-nums; font-weight: 600;
    }

    #toast {
        position: fixed; bottom: 24px; left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: rgba(20,20,20,0.95); color: #fff;
        border: 1px solid #333; border-radius: 8px;
        padding: 10px 18px; font-size: 13px; font-weight: 600;
        pointer-events: none; opacity: 0;
        transition: transform .25s, opacity .25s; z-index: 1000;
        letter-spacing: 0.2px;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 768px) {
        body { flex-direction: column; }
        #toolbar {
            flex: 0 0 auto; width: 100%; max-height: 46dvh;
            border-right: none; border-bottom: 1px solid var(--panel-border);
            padding: 12px;
        }
        #canvas-container { padding: 10px; }
        #zoom-controls { bottom: 12px; right: 12px; }
    }
</style>
</head>
<body>

<div id="toolbar">
    <div class="header">
        <h1>Radial Art</h1>
        <div class="header-actions">
            <button class="icon-btn" id="fsBtn" title="Fullscreen (F)">⛶</button>
        </div>
    </div>

    <div class="group">
        <h3>Brush</h3>

        <div class="control-group">
            <label for="brushType">Type</label>
            <select id="brushType">
                <option value="solid">Solid</option>
                <option value="pencil">Pencil</option>
                <option value="marker">Marker</option>
                <option value="spray">Spray</option>
                <option value="calligraphy">Calligraphy</option>
                <option value="neon">Neon</option>
            </select>
        </div>

        <div class="control-group">
            <label for="brushShape">Stamp Shape</label>
            <select id="brushShape">
                <option value="round">Round</option>
                <option value="square">Square</option>
                <option value="triangle">Triangle</option>
                <option value="star">Star</option>
            </select>
        </div>

        <div class="control-group">
            <label for="colorPicker">Color</label>
            <div class="color-row">
                <input type="color" id="colorPicker" value="#000000">
                <button class="dice-btn" id="randomColorBtn" title="Random color">🎲</button>
            </div>
            <div class="swatch-row" id="swatchRow"></div>
        </div>

        <div class="control-group">
            <label for="brushSize">
                <span>Size</span>
                <span class="val"><span id="sizeValue">8</span>px <kbd>[</kbd><kbd>]</kbd></span>
            </label>
            <input type="range" id="brushSize" min="1" max="120" value="8">
        </div>

        <div class="control-group">
            <label for="brushOpacity">
                <span>Opacity</span><span class="val"><span id="opacityValue">100</span>%</span>
            </label>
            <input type="range" id="brushOpacity" min="1" max="100" value="100">
        </div>

        <div class="control-group">
            <label for="brushSoftness">
                <span>Softness</span><span class="val"><span id="softnessValue">0</span></span>
            </label>
            <input type="range" id="brushSoftness" min="0" max="60" value="0">
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="rainbowMode">
            <label for="rainbowMode">Rainbow Gradient <kbd>R</kbd></label>
        </div>

        <div class="control-group">
            <label for="blendMode">Blend Mode</label>
            <select id="blendMode">
                <option value="source-over">Normal</option>
                <option value="lighter">Additive (Glow)</option>
                <option value="multiply">Multiply (Darken)</option>
            </select>
        </div>
    </div>

    <div class="group">
        <h3>Precision</h3>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="rulerMode">
            <label for="rulerMode">Ruler Mode <kbd>V</kbd></label>
        </div>

        <div class="control-group">
            <label for="angleSnap">Angle Snap <kbd>Shift</kbd></label>
            <select id="angleSnap">
                <option value="0">Off</option>
                <option value="15">15°</option>
                <option value="30">30°</option>
                <option value="45">45°</option>
                <option value="90">90°</option>
            </select>
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="gridSnap">
            <label for="gridSnap">Grid Snap (40px)</label>
        </div>
    </div>

    <div class="group">
        <h3>Input</h3>

        <div class="control-group">
            <label for="smoothing">
                <span>Smoothing</span><span class="val"><span id="smoothValue">2</span></span>
            </label>
            <input type="range" id="smoothing" min="0" max="20" value="2">
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="pressureMode" checked>
            <label for="pressureMode">Stylus Pressure</label>
        </div>
    </div>

    <div class="group">
        <h3>Symmetry</h3>

        <div class="control-group">
            <label for="segments">
                <span>Segments</span><span class="val" id="segmentValue">8</span>
            </label>
            <input type="range" id="segments" min="1" max="36" value="8">
            <div class="preset-row" id="presetRow"></div>
        </div>

        <div class="control-group">
            <label for="symRotation">
                <span>Rotation</span><span class="val"><span id="rotValue">0</span>°</span>
            </label>
            <input type="range" id="symRotation" min="0" max="360" value="0">
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="mirrorMode">
            <label for="mirrorMode">Kaleidoscope <kbd>M</kbd></label>
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="directionLock">
            <label for="directionLock">Direction Lock <kbd>L</kbd></label>
        </div>
    </div>

    <div class="group">
        <h3>Canvas</h3>

        <div class="control-group">
            <label for="bgColor">Background Color</label>
            <input type="color" id="bgColor" value="#ffffff">
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="transparentBg">
            <label for="transparentBg">Transparent <kbd>T</kbd></label>
        </div>

        <div class="control-group checkbox-group">
            <input type="checkbox" id="showGuides" checked>
            <label for="showGuides">Show Guides <kbd>G</kbd></label>
        </div>

        <div class="control-group">
            <label for="guidesOpacity">
                <span>Guides Opacity</span><span class="val"><span id="guidesOpValue">60</span>%</span>
            </label>
            <input type="range" id="guidesOpacity" min="5" max="100" value="60">
        </div>

        <div class="control-group">
            <label for="guideColor">Guide Color</label>
            <input type="color" id="guideColor" value="#ff0055">
        </div>
    </div>

    <div class="group">
        <div class="btn-row">
            <button id="undoBtn" disabled>Undo</button>
            <button id="redoBtn" disabled>Redo</button>
        </div>
        <div class="btn-row">
            <button id="eraserBtn">Eraser: OFF</button>
        </div>
        <div class="btn-row">
            <button id="clearBtn">Clear</button>
            <button id="exportBtn">Export PNG</button>
        </div>
        <div class="btn-row">
            <button id="copyBtn">Copy</button>
            <button id="resetSettingsBtn">Reset</button>
        </div>
    </div>
</div>

<div id="canvas-container">
    <div id="canvas-wrapper">
        <canvas id="mainCanvas" width="1200" height="1200"></canvas>
        <canvas id="overlayCanvas" width="1200" height="1200"></canvas>
    </div>
    <div id="zoom-controls">
        <button id="zoomInBtn" title="Zoom In (+)">+</button>
        <button id="zoomOutBtn" title="Zoom Out (−)">−</button>
        <button id="zoomResetBtn" title="Reset View (0)">⟲</button>
        <span id="zoomLabel">100%</span>
    </div>
</div>

<div id="toast"></div>

<script>
(() => {
    'use strict';

    const $ = id => document.getElementById(id);

    const mainCanvas  = $('mainCanvas');
    const ctx         = mainCanvas.getContext('2d');
    const overlay     = $('overlayCanvas');
    const overlayCtx  = overlay.getContext('2d');
    const wrapper     = $('canvas-wrapper');
    const container   = $('canvas-container');
    const toastEl     = $('toast');

    const W = mainCanvas.width;
    const H = mainCanvas.height;
    const CX = W / 2;
    const CY = H / 2;
    const MAX_HISTORY = 20;
    const STORAGE_KEY = 'radial-art-settings-v3';
    const RECENT_KEY  = 'radial-art-recent-colors-v3';
    const MAX_RECENT  = 9;
    const GRID_SIZE   = 40;

    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = W; bgCanvas.height = H;
    const bgCtx = bgCanvas.getContext('2d');

    const colorPicker    = $('colorPicker');
    const brushType      = $('brushType');
    const brushSize      = $('brushSize');
    const brushOpacity   = $('brushOpacity');
    const brushSoftness  = $('brushSoftness');
    const brushShape     = $('brushShape');
    const rainbowMode    = $('rainbowMode');
    const blendMode      = $('blendMode');
    const rulerMode      = $('rulerMode');
    const angleSnap      = $('angleSnap');
    const gridSnap       = $('gridSnap');
    const smoothingInput = $('smoothing');
    const pressureMode   = $('pressureMode');
    const segmentsInput  = $('segments');
    const symRotation    = $('symRotation');
    const mirrorMode     = $('mirrorMode');
    const directionLock  = $('directionLock');
    const bgColor        = $('bgColor');
    const transparentBg  = $('transparentBg');
    const showGuides     = $('showGuides');
    const guidesOpacity  = $('guidesOpacity');
    const guideColor     = $('guideColor');
    const eraserBtn      = $('eraserBtn');
    const undoBtn        = $('undoBtn');
    const redoBtn        = $('redoBtn');
    const swatchRow      = $('swatchRow');
    const presetRow      = $('presetRow');

    let isDrawing     = false;
    let activePointer = null;
    let startX = 0, startY = 0;
    let lastX  = 0, lastY  = 0;
    let prevMidX = 0, prevMidY = 0;
    let lockedAngle = null;
    let hue = 0;
    let isEraser = false;
    let cursorX = -1, cursorY = -1;
    let cursorInside = false;
    let currentPressure = 0.5;
    let currentPointerType = 'mouse';
    let lastSavePushTime = 0;

    let history = [];
    let historyStep = -1;
    let recentColors = [];

    const ruler = {
        active: false,
        anchor: null,
        preview: null
    };

    const PRESETS = [2, 3, 4, 6, 8, 12, 16, 24];
    const view = { zoom: 1, panX: 0, panY: 0 };
    let spaceDown = false;
    let isPanning = false;
    let panStartX = 0, panStartY = 0, panViewX = 0, panViewY = 0;

    function toast(msg, ms = 1400) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
    }

    function clampInt(v, lo, hi) {
        v = parseInt(v, 10);
        if (isNaN(v)) return lo;
        return Math.max(lo, Math.min(hi, v));
    }

    /* ---------------- History ---------------- */
    function snapshot() {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        c.getContext('2d').drawImage(mainCanvas, 0, 0);
        return c;
    }
    function saveState() {
        history.length = historyStep + 1;
        history.push(snapshot());
        if (history.length > MAX_HISTORY) history.shift();
        historyStep = history.length - 1;
        updateHistoryButtons();
    }
    function restoreState() {
        const snap = history[historyStep];
        if (!snap) return;
        resetCtxState();
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(snap, 0, 0);
        updateHistoryButtons();
    }
    function undo() { if (historyStep > 0) { historyStep--; restoreState(); } }
    function redo() { if (historyStep < history.length - 1) { historyStep++; restoreState(); } }
    function updateHistoryButtons() {
        undoBtn.disabled = historyStep <= 0;
        redoBtn.disabled = historyStep >= history.length - 1;
    }
    function resetCtxState() {
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
    }
    function clearCanvas(pushHistory = true) {
        resetCtxState();
        ctx.clearRect(0, 0, W, H);
        if (pushHistory) saveState();
    }

    /* ---------------- Background ---------------- */
    function updateBackground() {
        const transparent = transparentBg.checked;
        bgCtx.clearRect(0, 0, W, H);
        if (!transparent) {
            bgCtx.fillStyle = bgColor.value;
            bgCtx.fillRect(0, 0, W, H);
        }
        wrapper.classList.toggle('transparent-bg', transparent);
        wrapper.style.backgroundColor = transparent ? 'transparent' : bgColor.value;
    }

    /* ---------------- Snapping helpers ---------------- */
    function snapToGrid(p) {
        return {
            x: Math.round(p.x / GRID_SIZE) * GRID_SIZE,
            y: Math.round(p.y / GRID_SIZE) * GRID_SIZE
        };
    }
    function snapAngleTo(x0, y0, x1, y1, stepDeg) {
        const dx = x1 - x0, dy = y1 - y0;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.001) return { x: x1, y: y1 };
        const angle = Math.atan2(dy, dx);
        const step = stepDeg * Math.PI / 180;
        const snapped = Math.round(angle / step) * step;
        return {
            x: x0 + Math.cos(snapped) * dist,
            y: y0 + Math.sin(snapped) * dist
        };
    }
    function getEffectiveSnapDeg(shiftHeld) {
        if (shiftHeld) return 15;
        return clampInt(angleSnap.value, 0, 90);
    }

    /* ---------------- Overlay ---------------- */
    function drawGuideLines() {
        if (!showGuides.checked) return;

        const segments = clampInt(segmentsInput.value, 1, 36);
        const angleStep = (Math.PI * 2) / segments;
        const rotOffset = (parseFloat(symRotation.value) * Math.PI) / 180;
        const maxDist = Math.hypot(W, H);
        const alpha = clampInt(guidesOpacity.value, 5, 100) / 100;

        overlayCtx.save();
        overlayCtx.globalAlpha = alpha;
        overlayCtx.strokeStyle = guideColor.value;
        overlayCtx.lineWidth = 1.5;
        overlayCtx.setLineDash([8, 8]);
        for (let i = 0; i < segments; i++) {
            const angle = i * angleStep + rotOffset;
            overlayCtx.beginPath();
            overlayCtx.moveTo(CX, CY);
            overlayCtx.lineTo(CX + Math.cos(angle) * maxDist, CY + Math.sin(angle) * maxDist);
            overlayCtx.stroke();
        }
        overlayCtx.setLineDash([]);
        overlayCtx.beginPath();
        overlayCtx.arc(CX, CY, 4, 0, Math.PI * 2);
        overlayCtx.fillStyle = guideColor.value;
        overlayCtx.fill();
        overlayCtx.restore();
    }

    function drawRulerPreview() {
        if (!ruler.active) return;

        if (!ruler.anchor || !ruler.preview) return;

        const a = ruler.anchor;
        const b = ruler.preview;

        overlayCtx.save();
        overlayCtx.strokeStyle = 'rgba(91,140,255,0.85)';
        overlayCtx.lineWidth = 1.5;
        overlayCtx.setLineDash([10, 6]);
        forEachSymmetryOn(overlayCtx, () => {
            overlayCtx.beginPath();
            overlayCtx.moveTo(a.x - CX, a.y - CY);
            overlayCtx.lineTo(b.x - CX, b.y - CY);
            overlayCtx.stroke();
        });
        overlayCtx.restore();

        overlayCtx.save();
        overlayCtx.fillStyle = '#5b8cff';
        overlayCtx.strokeStyle = '#ffffff';
        overlayCtx.lineWidth = 2;
        overlayCtx.beginPath();
        overlayCtx.arc(a.x, a.y, 6, 0, Math.PI * 2);
        overlayCtx.fill();
        overlayCtx.stroke();

        overlayCtx.beginPath();
        overlayCtx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        overlayCtx.fillStyle = '#ffffff';
        overlayCtx.strokeStyle = '#5b8cff';
        overlayCtx.fill();
        overlayCtx.stroke();
        overlayCtx.restore();

        const angle = Math.atan2(b.y - a.y, b.x - a.x);
        const length = Math.hypot(b.x - a.x, b.y - a.y);
        const deg = ((angle * 180 / Math.PI) + 360) % 360;
        const info = `${deg.toFixed(1)}°  ·  ${length.toFixed(0)}px`;

        overlayCtx.save();
        overlayCtx.font = 'bold 15px -apple-system, BlinkMacSystemFont, sans-serif';
        overlayCtx.textAlign = 'left';
        overlayCtx.textBaseline = 'bottom';
        overlayCtx.lineWidth = 3;
        overlayCtx.strokeStyle = 'rgba(0,0,0,0.65)';
        overlayCtx.fillStyle = 'rgba(91,140,255,0.98)';
        const tx = b.x + 14;
        const ty = b.y - 14;
        overlayCtx.strokeText(info, tx, ty);
        overlayCtx.fillText(info, tx, ty);
        overlayCtx.restore();
    }

    function drawCursorPreview() {
        if (!cursorInside || isDrawing || isPanning) return;
        const size = effectiveBrushSize();
        overlayCtx.save();
        overlayCtx.strokeStyle = 'rgba(0,0,0,0.55)';
        overlayCtx.lineWidth = 2;
        overlayCtx.beginPath();
        overlayCtx.arc(cursorX, cursorY, size / 2 + 1, 0, Math.PI * 2);
        overlayCtx.stroke();
        overlayCtx.strokeStyle = 'rgba(255,255,255,0.9)';
        overlayCtx.lineWidth = 1;
        overlayCtx.beginPath();
        overlayCtx.arc(cursorX, cursorY, size / 2 + 1, 0, Math.PI * 2);
        overlayCtx.stroke();
        overlayCtx.restore();
    }

    function renderOverlay() {
        overlayCtx.clearRect(0, 0, W, H);
        drawGuideLines();
        drawRulerPreview();
        drawCursorPreview();
    }

    /* ---------------- Brush style ---------------- */
    function effectiveBrushSize() {
        let size = clampInt(brushSize.value, 1, 120);
        if (pressureMode.checked && currentPointerType === 'pen' && currentPressure > 0) {
            size *= 0.25 + currentPressure * 0.75;
        }
        return Math.max(0.5, size);
    }

    function currentColor() {
        return (rainbowMode.checked && !isEraser)
            ? `hsl(${hue.toFixed(1)}, 100%, 50%)`
            : colorPicker.value;
    }

    function applyBrushStyle() {
        const color = currentColor();
        const type = brushType.value;
        const softness = clampInt(brushSoftness.value, 0, 60);

        ctx.globalAlpha = clampInt(brushOpacity.value, 1, 100) / 100;
        ctx.globalCompositeOperation = isEraser ? 'destination-out' : blendMode.value;

        if (type === 'neon' && !isEraser) {
            ctx.globalCompositeOperation = 'lighter';
            ctx.shadowBlur = effectiveBrushSize() * 0.9;
            ctx.shadowColor = color;
        } else if (type === 'marker' && !isEraser) {
            ctx.globalAlpha *= 0.55;
            ctx.shadowBlur = 0;
        } else if (softness > 0 && !isEraser) {
            ctx.shadowBlur = softness;
            ctx.shadowColor = color;
        } else {
            ctx.shadowBlur = 0;
        }

        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = effectiveBrushSize();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }

    function drawShapePath(x, y, size, shape, angle) {
        ctx.beginPath();
        switch (shape) {
            case 'square':
                ctx.rect(x - size / 2, y - size / 2, size, size);
                ctx.fill();
                break;
            case 'triangle': {
                const c = Math.cos(angle), s = Math.sin(angle);
                const h = size / 2;
                ctx.moveTo(x + c * h, y + s * h);
                ctx.lineTo(x + c * -h - s * h, y + s * -h + c * h);
                ctx.lineTo(x + c * -h + s * h, y + s * -h - c * h);
                ctx.closePath();
                ctx.fill();
                break;
            }
            case 'star': {
                const c = Math.cos(angle), s = Math.sin(angle);
                const spikes = 5;
                const outerR = size / 2;
                const innerR = size / 4;
                let rot = -Math.PI / 2;
                const step = Math.PI / spikes;
                let first = true;
                for (let i = 0; i < spikes; i++) {
                    const ox = Math.cos(rot) * outerR;
                    const oy = Math.sin(rot) * outerR;
                    const px = x + ox * c - oy * s;
                    const py = y + ox * s + oy * c;
                    if (first) { ctx.moveTo(px, py); first = false; }
                    else ctx.lineTo(px, py);
                    rot += step;
                    const ix = Math.cos(rot) * innerR;
                    const iy = Math.sin(rot) * innerR;
                    ctx.lineTo(x + ix * c - iy * s, y + ix * s + iy * c);
                    rot += step;
                }
                ctx.closePath();
                ctx.fill();
                break;
            }
            default:
                ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                ctx.fill();
        }
    }

    /* ---------------- Symmetry ---------------- */
    function getTransforms() {
        const segments = clampInt(segmentsInput.value, 1, 36);
        const angleStep = (Math.PI * 2) / segments;
        const rotOffset = (parseFloat(symRotation.value) * Math.PI) / 180;
        const mirrored = mirrorMode.checked;
        const list = [];
        for (let i = 0; i < segments; i++) {
            const theta = i * angleStep + rotOffset;
            list.push({ theta, mirror: false });
            if (mirrored) list.push({ theta, mirror: true });
        }
        return list;
    }

    function forEachSymmetryOn(targetCtx, drawFn) {
        const transforms = getTransforms();
        for (let i = 0; i < transforms.length; i++) {
            const t = transforms[i];
            targetCtx.save();
            targetCtx.translate(CX, CY);
            targetCtx.rotate(t.theta);
            if (t.mirror) targetCtx.scale(1, -1);
            drawFn();
            targetCtx.restore();
        }
    }

    function forEachSymmetry(drawFn) {
        forEachSymmetryOn(ctx, drawFn);
    }

    /* ---------------- Stamp helpers ---------------- */
    function paintStampLocal(x, y, size, shape, angle) {
        drawShapePath(x, y, size, shape, angle);
    }
    function paintSprayCluster(x, y, size) {
        const count = Math.max(4, Math.round(size * 0.6));
        const radius = size * 0.55;
        const dotSize = Math.max(0.5, size * 0.18);
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * radius;
            drawShapePath(x + Math.cos(a) * r, y + Math.sin(a) * r, dotSize, 'round', 0);
        }
    }
    function paintCalligraphyNib(x, y, size) {
        const nibA = Math.PI / 4;
        const nx = Math.cos(nibA) * size * 0.5;
        const ny = Math.sin(nibA) * size * 0.5;
        ctx.beginPath();
        ctx.moveTo(x - nx, y - ny);
        ctx.lineTo(x + nx, y + ny);
        ctx.lineWidth = Math.max(0.5, size * 0.13);
        ctx.lineCap = 'round';
        ctx.stroke();
    }

    function getStrokeParams(type, size, angle) {
        let spacing, jitter = 0, dotSize = size, angleOffset = 0;
        switch (type) {
            case 'pencil':   spacing = Math.max(0.6, size * 0.14); jitter = size * 0.14; dotSize = size * 0.7; break;
            case 'marker':   spacing = Math.max(0.6, size * 0.1);  dotSize = size * 1.1; angleOffset = angle; break;
            case 'spray':    spacing = Math.max(0.5, size * 0.35); break;
            case 'calligraphy': spacing = Math.max(0.5, size * 0.08); break;
            case 'neon':     spacing = Math.max(0.7, size * 0.16); angleOffset = angle; break;
            default:         spacing = Math.max(0.7, size * 0.22); angleOffset = angle;
        }
        return { spacing, jitter, dotSize, angleOffset };
    }

    function paintStroke(type, shape, x0, y0, x1, y1) {
        const size = effectiveBrushSize();
        const dist = Math.hypot(x1 - x0, y1 - y0);
        if (dist < 0.001) return;
        const angle = Math.atan2(y1 - y0, x1 - x0);
        const { spacing, jitter, dotSize, angleOffset } = getStrokeParams(type, size, angle);

        const steps = Math.max(1, Math.min(800, Math.ceil(dist / spacing)));
        for (let s = 1; s <= steps; s++) {
            const t = s / steps;
            let px = x0 + (x1 - x0) * t;
            let py = y0 + (y1 - y0) * t;
            if (jitter > 0) {
                px += (Math.random() - 0.5) * jitter * 2;
                py += (Math.random() - 0.5) * jitter * 2;
            }
            if (type === 'spray') paintSprayCluster(px, py, size);
            else if (type === 'calligraphy') paintCalligraphyNib(px, py, size);
            else paintStampLocal(px, py, dotSize, shape, angleOffset);
        }
    }

    function renderSegment(x0, y0, x1, y1, smooth) {
        const type = brushType.value;
        const shape = brushShape.value;
        const size = effectiveBrushSize();
        const dx = x1 - x0, dy = y1 - y0;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.001) return;

        applyBrushStyle();

        forEachSymmetry(() => {
            const ax = x0 - CX, ay = y0 - CY;
            const bx = x1 - CX, by = y1 - CY;

            if (type === 'solid' && shape === 'round' && smooth) {
                ctx.beginPath();
                const pmx = prevMidX - CX, pmy = prevMidY - CY;
                const mx = ((x0 + x1) / 2) - CX, my = ((y0 + y1) / 2) - CY;
                ctx.moveTo(pmx, pmy);
                ctx.quadraticCurveTo(ax, ay, mx, my);
                ctx.stroke();
                return;
            }

            const localAngle = Math.atan2(by - ay, bx - ax);
            const { spacing, jitter, dotSize, angleOffset } = getStrokeParams(type, size, localAngle);
            const steps = Math.max(1, Math.min(600, Math.ceil(dist / spacing)));

            for (let s = 1; s <= steps; s++) {
                const t = s / steps;
                let px = ax + (bx - ax) * t;
                let py = ay + (by - ay) * t;
                if (jitter > 0) {
                    px += (Math.random() - 0.5) * jitter * 2;
                    py += (Math.random() - 0.5) * jitter * 2;
                }
                if (type === 'spray') paintSprayCluster(px, py, size);
                else if (type === 'calligraphy') paintCalligraphyNib(px, py, size);
                else paintStampLocal(px, py, dotSize, shape, angleOffset);
            }
        });
    }

    function commitRulerLine(x0, y0, x1, y1) {
        const type = brushType.value;
        const shape = brushShape.value;
        const size = effectiveBrushSize();
        const dist = Math.hypot(x1 - x0, y1 - y0);
        if (dist < 0.5) return;

        applyBrushStyle();

        forEachSymmetry(() => {
            const ax = x0 - CX, ay = y0 - CY;
            const bx = x1 - CX, by = y1 - CY;

            if (type === 'solid' && shape === 'round') {
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(bx, by);
                ctx.stroke();
                return;
            }

            const localAngle = Math.atan2(by - ay, bx - ax);
            const { spacing, jitter, dotSize, angleOffset } = getStrokeParams(type, size, localAngle);
            const steps = Math.max(1, Math.min(800, Math.ceil(dist / spacing)));

            for (let s = 1; s <= steps; s++) {
                const t = s / steps;
                let px = ax + (bx - ax) * t;
                let py = ay + (by - ay) * t;
                if (jitter > 0) {
                    px += (Math.random() - 0.5) * jitter * 2;
                    py += (Math.random() - 0.5) * jitter * 2;
                }
                if (type === 'spray') paintSprayCluster(px, py, size);
                else if (type === 'calligraphy') paintCalligraphyNib(px, py, size);
                else paintStampLocal(px, py, dotSize, shape, angleOffset);
            }
        });

        resetCtxState();
    }

    function stampDot() {
        const type = brushType.value;
        const shape = brushShape.value;
        const size = effectiveBrushSize();

        applyBrushStyle();
        forEachSymmetry(() => {
            const lx = lastX - CX, ly = lastY - CY;
            if (type === 'spray') {
                paintSprayCluster(lx, ly, size);
            } else if (type === 'calligraphy') {
                paintCalligraphyNib(lx, ly, size);
            } else if (type === 'marker') {
                paintStampLocal(lx, ly, size * 1.1, shape, 0);
            } else if (type === 'pencil') {
                for (let i = 0; i < 3; i++) {
                    const jx = (Math.random() - 0.5) * size * 0.28;
                    const jy = (Math.random() - 0.5) * size * 0.28;
                    paintStampLocal(lx + jx, ly + jy, size * 0.7, shape, 0);
                }
            } else {
                paintStampLocal(lx, ly, size, shape, 0);
            }
        });
    }

    /* ---------------- Pointer helpers ---------------- */
    function getPos(e) {
        const rect = mainCanvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (W / rect.width),
            y: (e.clientY - rect.top) * (H / rect.height)
        };
    }

    function applySnap(p, shiftHeld, anchorForAngle) {
        let out = p;
        if (gridSnap.checked) out = snapToGrid(out);
        if (anchorForAngle) {
            const deg = getEffectiveSnapDeg(shiftHeld);
            if (deg > 0) {
                out = snapAngleTo(anchorForAngle.x, anchorForAngle.y, out.x, out.y, deg);
            }
        }
        return out;
    }

    /* ---------------- Pointer events ---------------- */
    function onPointerDown(e) {
        if (spaceDown || e.button === 1) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (activePointer !== null) return;
        e.preventDefault();

        activePointer = e.pointerId;
        currentPointerType = e.pointerType;
        currentPressure = e.pressure > 0 ? e.pressure : 0.5;

        const raw = getPos(e);

        if (ruler.active) {
            let p = applySnap(raw, e.shiftKey, ruler.anchor);

            if (!ruler.anchor) {
                ruler.anchor = p;
                ruler.preview = p;
                cursorX = p.x;
                cursorY = p.y;
                cursorInside = true;
                renderOverlay();
                return;
            }

            commitRulerLine(ruler.anchor.x, ruler.anchor.y, p.x, p.y);
            saveState();
            ruler.anchor = p;
            ruler.preview = p;
            cursorX = p.x;
            cursorY = p.y;
            renderOverlay();
            return;
        }

        isDrawing = true;
        startX = lastX = prevMidX = raw.x;
        startY = lastY = prevMidY = raw.y;
        lockedAngle = null;

        try { mainCanvas.setPointerCapture(e.pointerId); } catch (_) {}
        stampDot();
    }

    function onPointerMove(e) {
        const raw = getPos(e);

        if (ruler.active) {
            const p = applySnap(raw, e.shiftKey, ruler.anchor);
            cursorX = p.x;
            cursorY = p.y;
            cursorInside = true;
            ruler.preview = p;
            renderOverlay();
            return;
        }

        cursorX = raw.x;
        cursorY = raw.y;
        cursorInside = true;

        if (isDrawing && e.pointerId === activePointer) {
            currentPressure = e.pressure > 0 ? e.pressure : 0.5;
            currentPointerType = e.pointerType;
        }

        if (!isDrawing || e.pointerId !== activePointer) {
            renderOverlay();
            return;
        }
        e.preventDefault();

        let p = raw;

        if (directionLock.checked) {
            const dx = p.x - startX;
            const dy = p.y - startY;
            if (lockedAngle === null && Math.hypot(dx, dy) > 4) {
                lockedAngle = Math.atan2(dy, dx);
            }
            if (lockedAngle !== null) {
                const proj = dx * Math.cos(lockedAngle) + dy * Math.sin(lockedAngle);
                p = {
                    x: startX + proj * Math.cos(lockedAngle),
                    y: startY + proj * Math.sin(lockedAngle)
                };
            }
        } else {
            const deg = getEffectiveSnapDeg(e.shiftKey);
            if (deg > 0) {
                p = snapAngleTo(startX, startY, p.x, p.y, deg);
            }
        }

        const smoothVal = clampInt(smoothingInput.value, 0, 20);
        const minDist = 0.4 + smoothVal * 0.08;

        const dist = Math.hypot(p.x - lastX, p.y - lastY);
        if (dist < minDist) return;

        if (rainbowMode.checked && !isEraser) {
            hue = (hue + dist * 0.45) % 360;
        }

        const smoothCurve = brushType.value === 'solid' && brushShape.value === 'round';
        const midX = (lastX + p.x) / 2;
        const midY = (lastY + p.y) / 2;

        renderSegment(lastX, lastY, p.x, p.y, smoothCurve);

        lastX = p.x; lastY = p.y;
        prevMidX = midX; prevMidY = midY;

        const now = performance.now();
        if (now - lastSavePushTime > 4000) {
            lastSavePushTime = now;
            saveState();
        }
    }

    function onPointerUp(e) {
        if (e.pointerId !== activePointer) return;
        activePointer = null;

        if (ruler.active) return;

        if (!isDrawing) return;
        isDrawing = false;
        lockedAngle = null;
        try {
            if (mainCanvas.hasPointerCapture(e.pointerId)) {
                mainCanvas.releasePointerCapture(e.pointerId);
            }
        } catch (_) {}
        resetCtxState();
        saveState();
    }

    mainCanvas.addEventListener('pointerdown', onPointerDown);
    mainCanvas.addEventListener('pointermove', onPointerMove);
    mainCanvas.addEventListener('pointerup', onPointerUp);
    mainCanvas.addEventListener('pointercancel', onPointerUp);
    mainCanvas.addEventListener('pointerleave', () => {
        cursorInside = false;
        renderOverlay();
    });
    mainCanvas.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (ruler.active && ruler.anchor) {
            ruler.anchor = null;
            ruler.preview = null;
            renderOverlay();
            toast('Ruler chain ended', 900);
        }
    });

    /* ---------------- Pan / Zoom ---------------- */
    function applyView() {
        wrapper.style.transform = `translate(${view.panX}px, ${view.panY}px) scale(${view.zoom})`;
        $('zoomLabel').textContent = Math.round(view.zoom * 100) + '%';
    }
    function zoomAtPoint(factor, mx, my) {
        const oldZoom = view.zoom;
        const newZoom = Math.max(0.15, Math.min(8, oldZoom * factor));
        if (Math.abs(newZoom - oldZoom) < 0.0001) return;
        const rect = container.getBoundingClientRect();
        const ccx = rect.width / 2;
        const ccy = rect.height / 2;
        const wcx = ccx + view.panX;
        const wcy = ccy + view.panY;
        const ratio = newZoom / oldZoom;
        const newWcx = mx - (mx - wcx) * ratio;
        const newWcy = my - (my - wcy) * ratio;
        view.zoom = newZoom;
        view.panX = newWcx - ccx;
        view.panY = newWcy - ccy;
        applyView();
    }
    function zoomCenter(factor) {
        const oldZoom = view.zoom;
        const newZoom = Math.max(0.15, Math.min(8, oldZoom * factor));
        if (Math.abs(newZoom - oldZoom) < 0.0001) return;
        const ratio = newZoom / oldZoom;
        view.panX *= ratio;
        view.panY *= ratio;
        view.zoom = newZoom;
        applyView();
    }

    container.addEventListener('wheel', e => {
        if (isDrawing) return;
        e.preventDefault();
        const rect = container.getBoundingClientRect();
        zoomAtPoint(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    container.addEventListener('pointerdown', e => {
        if (!spaceDown && e.button !== 1) return;
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panViewX = view.panX;
        panViewY = view.panY;
        container.classList.add('panning');
    });
    window.addEventListener('pointermove', e => {
        if (!isPanning) return;
        view.panX = panViewX + (e.clientX - panStartX);
        view.panY = panViewY + (e.clientY - panStartY);
        applyView();
    });
    window.addEventListener('pointerup', () => {
        if (isPanning) {
            isPanning = false;
            container.classList.remove('panning');
        }
    });

    $('zoomInBtn').addEventListener('click', () => zoomCenter(1.2));
    $('zoomOutBtn').addEventListener('click', () => zoomCenter(1 / 1.2));
    $('zoomResetBtn').addEventListener('click', () => {
        view.zoom = 1; view.panX = 0; view.panY = 0;
        applyView();
        toast('View reset', 800);
    });

    /* ---------------- Export / Copy ---------------- */
    function renderComposite() {
        const out = document.createElement('canvas');
        out.width = W; out.height = H;
        const octx = out.getContext('2d');
        if (!transparentBg.checked) octx.drawImage(bgCanvas, 0, 0);
        octx.drawImage(mainCanvas, 0, 0);
        return out;
    }
    function exportPNG() {
        const out = renderComposite();
        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        const link = document.createElement('a');
        link.download = `radial-art-${stamp}.png`;
        link.href = out.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        link.remove();
        toast('Exported PNG');
    }
    async function copyToClipboard() {
        try {
            const out = renderComposite();
            const blob = await new Promise(r => out.toBlob(r, 'image/png'));
            if (!blob) throw new Error('Blob failed');
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            toast('Copied to clipboard');
        } catch (err) {
            toast('Copy failed: ' + (err.message || err), 2200);
        }
    }

    /* ---------------- Recent colors ---------------- */
    function loadRecentColors() {
        try {
            const raw = localStorage.getItem(RECENT_KEY);
            if (raw) recentColors = JSON.parse(raw).slice(0, MAX_RECENT);
        } catch (_) { recentColors = []; }
    }
    function saveRecentColors() {
        try { localStorage.setItem(RECENT_KEY, JSON.stringify(recentColors)); } catch (_) {}
    }
    function pushRecentColor(color) {
        color = String(color).toLowerCase();
        recentColors = [color, ...recentColors.filter(c => c !== color)].slice(0, MAX_RECENT);
        saveRecentColors();
        renderSwatches();
    }
    function renderSwatches() {
        swatchRow.innerHTML = '';
        const active = colorPicker.value.toLowerCase();
        for (let i = 0; i < MAX_RECENT; i++) {
            const color = recentColors[i];
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'swatch' + (color === active ? ' active' : '');
            if (color) {
                b.style.background = color;
                b.title = `${color}  (${i + 1})`;
                b.dataset.key = i + 1;
                b.addEventListener('click', () => {
                    colorPicker.value = color;
                    pushRecentColor(color);
                    persistSettings();
                });
            } else {
                b.style.background = 'transparent';
                b.style.border = '1px dashed #2a2a2a';
                b.disabled = true;
            }
            swatchRow.appendChild(b);
        }
    }

    /* ---------------- Presets ---------------- */
    function renderPresets() {
        presetRow.innerHTML = '';
        PRESETS.forEach(n => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'preset-btn';
            b.textContent = n;
            b.addEventListener('click', () => {
                segmentsInput.value = n;
                $('segmentValue').textContent = n;
                renderOverlay();
                persistSettings();
            });
            presetRow.appendChild(b);
        });
    }

    /* ---------------- Settings ---------------- */
    const SETTINGS_MAP = [
        ['brushType',     brushType,     'value'],
        ['brushShape',    brushShape,    'value'],
        ['colorPicker',   colorPicker,   'value'],
        ['brushSize',     brushSize,     'value'],
        ['brushOpacity',  brushOpacity,  'value'],
        ['brushSoftness', brushSoftness, 'value'],
        ['rainbowMode',   rainbowMode,   'checked'],
        ['blendMode',     blendMode,     'value'],
        ['rulerMode',     rulerMode,     'checked'],
        ['angleSnap',     angleSnap,     'value'],
        ['gridSnap',      gridSnap,      'checked'],
        ['smoothing',     smoothingInput,'value'],
        ['pressureMode',  pressureMode,  'checked'],
        ['segments',      segmentsInput, 'value'],
        ['symRotation',   symRotation,   'value'],
        ['mirrorMode',    mirrorMode,    'checked'],
        ['directionLock', directionLock, 'checked'],
        ['bgColor',       bgColor,       'value'],
        ['transparentBg', transparentBg, 'checked'],
        ['showGuides',    showGuides,    'checked'],
        ['guidesOpacity', guidesOpacity, 'value'],
        ['guideColor',    guideColor,    'value'],
    ];
    function persistSettings() {
        const data = {};
        SETTINGS_MAP.forEach(([key, el, prop]) => { data[key] = el[prop]; });
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
    }
    function loadSettings() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            SETTINGS_MAP.forEach(([key, el, prop]) => {
                if (key in data && data[key] !== undefined) el[prop] = data[key];
            });
            ruler.active = rulerMode.checked;
        } catch (_) {}
    }
    function resetSettings() {
        brushType.value = 'solid';
        brushShape.value = 'round';
        colorPicker.value = '#000000';
        brushSize.value = 8;
        brushOpacity.value = 100;
        brushSoftness.value = 0;
        rainbowMode.checked = false;
        blendMode.value = 'source-over';
        rulerMode.checked = false;
        angleSnap.value = '0';
        gridSnap.checked = false;
        smoothingInput.value = 2;
        pressureMode.checked = true;
        segmentsInput.value = 8;
        symRotation.value = 0;
        mirrorMode.checked = false;
        directionLock.checked = false;
        bgColor.value = '#ffffff';
        transparentBg.checked = false;
        showGuides.checked = true;
        guidesOpacity.value = 60;
        guideColor.value = '#ff0055';
        ruler.active = false;
        ruler.anchor = null;
        ruler.preview = null;
        syncAllLabels();
        updateBackground();
        renderOverlay();
        persistSettings();
        toast('Settings reset');
    }

    /* ---------------- Labels ---------------- */
    function syncAllLabels() {
        $('sizeValue').textContent = brushSize.value;
        $('opacityValue').textContent = brushOpacity.value;
        $('softnessValue').textContent = brushSoftness.value;
        $('smoothValue').textContent = smoothingInput.value;
        $('segmentValue').textContent = segmentsInput.value;
        $('rotValue').textContent = symRotation.value;
        $('guidesOpValue').textContent = guidesOpacity.value;
    }
    function bindRangeLabel(input, labelId) {
        const label = $(labelId);
        const sync = () => { label.textContent = input.value; };
        input.addEventListener('input', sync);
        sync();
    }

    /* ---------------- Responsive ---------------- */
    function resizeWrapper() {
        const pad = 28;
        const size = Math.max(
            120,
            Math.min(container.clientWidth, container.clientHeight) - pad
        );
        wrapper.style.width = size + 'px';
        wrapper.style.height = size + 'px';
    }

    /* ---------------- Wire-up ---------------- */
    bindRangeLabel(brushSize, 'sizeValue');
    bindRangeLabel(brushOpacity, 'opacityValue');
    bindRangeLabel(brushSoftness, 'softnessValue');
    bindRangeLabel(smoothingInput, 'smoothValue');
    bindRangeLabel(segmentsInput, 'segmentValue');
    bindRangeLabel(symRotation, 'rotValue');
    bindRangeLabel(guidesOpacity, 'guidesOpValue');

    [segmentsInput, symRotation, mirrorMode, showGuides, guideColor, guidesOpacity].forEach(el => {
        el.addEventListener('input', () => { renderOverlay(); persistSettings(); });
        el.addEventListener('change', () => { renderOverlay(); persistSettings(); });
    });

    [brushSize, brushOpacity, brushSoftness, brushShape, brushType, blendMode, smoothingInput,
     pressureMode, angleSnap, gridSnap].forEach(el => {
        el.addEventListener('input', () => { renderOverlay(); persistSettings(); });
        el.addEventListener('change', persistSettings);
    });

    rulerMode.addEventListener('change', () => {
        ruler.active = rulerMode.checked;
        ruler.anchor = null;
        ruler.preview = null;
        if (ruler.active) {
            toast('Ruler ON — click to place · Shift snaps · Esc ends chain', 2600);
        } else {
            toast('Ruler OFF', 800);
        }
        renderOverlay();
        persistSettings();
    });

    colorPicker.addEventListener('input', () => {
        pushRecentColor(colorPicker.value);
        persistSettings();
    });
    bgColor.addEventListener('input', () => { updateBackground(); persistSettings(); });
    transparentBg.addEventListener('change', () => { updateBackground(); persistSettings(); });
    rainbowMode.addEventListener('change', persistSettings);

    eraserBtn.addEventListener('click', () => {
        isEraser = !isEraser;
        eraserBtn.textContent = isEraser ? 'Eraser: ON' : 'Eraser: OFF';
        eraserBtn.classList.toggle('active', isEraser);
        toast(isEraser ? 'Eraser ON' : 'Eraser OFF', 800);
    });

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);
    $('clearBtn').addEventListener('click', () => { clearCanvas(true); toast('Canvas cleared'); });
    $('exportBtn').addEventListener('click', exportPNG);
    $('copyBtn').addEventListener('click', copyToClipboard);
    $('resetSettingsBtn').addEventListener('click', resetSettings);

    $('randomColorBtn').addEventListener('click', () => {
        const h = Math.floor(Math.random() * 360);
        const s = 60 + Math.floor(Math.random() * 40);
        const l = 35 + Math.floor(Math.random() * 35);
        colorPicker.value = hslToHex(h, s, l);
        pushRecentColor(colorPicker.value);
        persistSettings();
    });

    $('fsBtn').addEventListener('click', toggleFullscreen);

    function hslToHex(h, s, l) {
        s /= 100; l /= 100;
        const k = n => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        const toHex = x => Math.round(x * 255).toString(16).padStart(2, '0');
        return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
    }
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            const el = document.documentElement;
            (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
        } else {
            (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
        }
    }

    /* ---------------- Keyboard (layout-independent via e.code) ---------------- */
    window.addEventListener('keydown', e => {
        const active = document.activeElement;
        const isTypingField = active && (
            active.tagName === 'TEXTAREA' ||
            active.tagName === 'SELECT' ||
            active.tagName === 'BUTTON' ||
            (active.tagName === 'INPUT' && active.type !== 'range')
        );

        if (e.code === 'Space' && !isTypingField && !spaceDown) {
            spaceDown = true;
            container.classList.add('pan-ready');
            e.preventDefault();
            return;
        }

        if (e.code === 'Escape') {
            if (ruler.active && ruler.anchor) {
                ruler.anchor = null;
                ruler.preview = null;
                renderOverlay();
                toast('Ruler chain ended', 900);
            } else if (isDrawing) {
                isDrawing = false;
                activePointer = null;
                resetCtxState();
                saveState();
            }
            return;
        }

        const mod = e.ctrlKey || e.metaKey;

        if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
        if (mod && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
        if (mod && e.code === 'KeyS') { e.preventDefault(); exportPNG(); return; }
        if (mod && e.code === 'KeyC') { e.preventDefault(); copyToClipboard(); return; }

        if (isTypingField) return;

        switch (e.code) {
            case 'Backspace':
            case 'Delete':
                e.preventDefault();
                clearCanvas(true);
                toast('Canvas cleared');
                return;
            case 'KeyR': rainbowMode.click(); persistSettings(); return;
            case 'KeyM': mirrorMode.click(); renderOverlay(); persistSettings(); return;
            case 'KeyL':
                directionLock.click();
                persistSettings();
                toast(directionLock.checked ? 'Direction Lock ON' : 'Direction Lock OFF', 800);
                return;
            case 'KeyT': transparentBg.click(); return;
            case 'KeyE': eraserBtn.click(); return;
            case 'KeyG':
                showGuides.checked = !showGuides.checked;
                renderOverlay();
                persistSettings();
                return;
            case 'KeyF': toggleFullscreen(); return;
            case 'KeyV':
                rulerMode.checked = !rulerMode.checked;
                rulerMode.dispatchEvent(new Event('change'));
                return;
            case 'Tab':
                e.preventDefault();
                document.body.classList.toggle('hide-ui');
                toast(document.body.classList.contains('hide-ui') ? 'UI hidden — Tab to show' : 'UI shown', 1400);
                return;
            case 'BracketLeft':
                brushSize.value = Math.max(1, clampInt(brushSize.value, 1, 120) - 2);
                brushSize.dispatchEvent(new Event('input'));
                return;
            case 'BracketRight':
                brushSize.value = Math.min(120, clampInt(brushSize.value, 1, 120) + 2);
                brushSize.dispatchEvent(new Event('input'));
                return;
            case 'Digit0':
                view.zoom = 1; view.panX = 0; view.panY = 0;
                applyView();
                toast('View reset', 800);
                return;
            case 'Equal':
                zoomCenter(1.15);
                return;
            case 'Minus':
                zoomCenter(1 / 1.15);
                return;
        }

        if (/^Digit[1-9]$/.test(e.code)) {
            const idx = parseInt(e.code.slice(5), 10) - 1;
            if (recentColors[idx]) {
                colorPicker.value = recentColors[idx];
                pushRecentColor(recentColors[idx]);
                persistSettings();
            }
            return;
        }
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'Space') {
            spaceDown = false;
            container.classList.remove('pan-ready');
            isPanning = false;
            container.classList.remove('panning');
        }
    });

    /* ---------------- Boot ---------------- */
    loadRecentColors();
    renderSwatches();
    renderPresets();
    loadSettings();
    syncAllLabels();
    ruler.active = rulerMode.checked;

    if (window.ResizeObserver) {
        new ResizeObserver(resizeWrapper).observe(container);
    } else {
        window.addEventListener('resize', resizeWrapper);
    }

    resizeWrapper();
    updateBackground();
    clearCanvas(false);
    renderOverlay();
    applyView();
    saveState();
    updateHistoryButtons();

    if (recentColors.length === 0) {
        ['#000000', '#ffffff', '#ff0055', '#5b8cff', '#00e0a4'].forEach(pushRecentColor);
    }
})();
</script>
</body>
</html>
